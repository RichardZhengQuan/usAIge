name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Package.swift needs swift-tools 6.2, which ships with Xcode 26.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  relay:
    name: Relay worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Relay contract tests
        run: node --experimental-strip-types --test tests/relay-contract.test.mjs
      - name: Lint
        run: npm run lint
